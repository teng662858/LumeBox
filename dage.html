<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {--bg-color: #2e2e2e; 
      --text-color: #e0e0e0; 
      --heading-color: #ffffff;
      --button-bg: #484f59; 
      --button-hover-bg: #0b5ed7;
      --button-text-color: #ffffff; 
  }
  html, body { height: 100%; }
  body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center; 
      text-align: center;
      padding: 25px;
      overflow: hidden; 
  }
  .content {  max-width: 600px;  width: 100%;   }
  p {  margin-bottom: 35px; font-size: clamp(1em, 3vw, 1.15em); line-height: 1.7;  opacity: 0.9; }
  .continue-button {
      background-color: var(--button-bg); color: var(--button-text-color);  border: none;
      padding: 14px 16px;  border-radius: 6px;width: 220px;height: 48px; margin-bottom:10px;
      font-size: clamp(1em, 2.5vw, 1.1em);  font-weight: 500; cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease; outline: none; display: inline-block; 
  }
</style> </head> <body>
    <div class="content">
        <p>请点击"继续继续访问进入主页"<br />如果不想看到此页面,请直接收藏或者访问/enter页面</p>
        <p>Please click "Continue" to enter the homepage.<br />
          If you wish to skip this page in the future, please bookmark the site or visit the /enter page directly.</p>
          <p>「続行」をクリックしてホームページに進んでください。<br />
            今後このページを省略したい場合は、サイトを直接ブックマークするか、/enterページにアクセスしてください。</p>
        <button name="continueBtn" class="continue-button">继续访问</button><br />
        <button name="continueBtn" class="continue-button">Continue</button><br />
        <button name="continueBtn" class="continue-button">続行</button>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const continueButtons = document.querySelectorAll('button[name="continueBtn"]');
            continueButtons.forEach(function(button) {
              button.addEventListener('click', function() {
                  try{ document.cookie = 'x-index-auth=authed; path=/'; }catch(e){}
                  location.href = '/enter';
              });
            });
        });
    </script>
</body>
</html>
