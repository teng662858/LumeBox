# 只编译、不签名：产出未签名 IPA（在本地用 Sideloadly + 自有证书重签名后安装）。
#
# 触发规则（2026-10-20 起）：**只在手动触发时构建，push/合并到 main 不会自动出包。**
# 需要包时：Actions → Build unsigned IPA (iOS) → Run workflow（或让 AI 用 gh 触发）。
# 额度提醒：私有仓库的 macOS runner 按 10 倍折算 Actions 用量，手动构建便于控制成本。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
name: Build unsigned IPA (iOS)

on:
  workflow_dispatch:
    inputs:
      remux_only:
        description: '只检查离线 MP4 合并，不构建 App'
        type: boolean
        default: false
      models_only:
        description: '只预计算并验证离线模型资源，不构建 App'
        type: boolean
        default: false
      typecheck_only:
        description: '只检查 Swift 类型，不编译 App、不生成或上传安装包'
        type: boolean
        default: false

run-name: ${{ inputs.remux_only && 'Offline MP4 remux check — no package' || inputs.typecheck_only && 'Swift typecheck only — no package' || 'Build unsigned IPA' }}

jobs:
  remux:
    if: ${{ inputs.remux_only == true }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/offline-remux-check
          key: offline-remux-ffmpeg-3.11.1-${{ runner.os }}-${{ runner.arch }}
      - name: Resolve the app's FFmpeg dependency without compiling Flutter
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/remux-dependency"
          mkdir -p "$PACKAGE/Sources/Probe"
          cat > "$PACKAGE/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(name: "RemuxDependency", platforms: [.macOS(.v14)], dependencies: [
            .package(url: "https://github.com/superuser404notfound/FFmpegBuild", exact: "3.11.1")
          ], targets: [.executableTarget(name: "Probe", dependencies: [
            .product(name: "AetherFFmpegBuild", package: "FFmpegBuild")
          ])])
          SWIFT
          echo 'import AetherLibavformat; print(avformat_version())' > "$PACKAGE/Sources/Probe/main.swift"
          swift build --package-path "$PACKAGE" --scratch-path "$PWD/build/offline-remux-check"
      - name: Test the production Swift merge implementation with real media
        run: bash tool/check_offline_remux.sh

  model-assets:
    if: ${{ inputs.models_only == true }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Precompute and verify fixed Core ML anchors
        run: python3 tool/prepare_intro_models.py --precompute --output out/anchor_vectors.json
      - uses: actions/upload-artifact@v4
        with:
          name: intro-anchor-vectors
          path: out/anchor_vectors.json
          if-no-files-found: error
  # 手动构建直接运行；全量分析与测试由 quality.yml 独立按需执行。
  build-ipa:
    if: ${{ inputs.models_only != true && inputs.remux_only != true }}
    name: ${{ inputs.typecheck_only && 'Swift and simulator checks (no IPA)' || 'Build unsigned IPA' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Match the checked-in lockfile source and exact tested versions.
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 固定与开发机一致的版本（pubspec 要求 Dart ^3.13.4）；升级 Flutter 时同步改这里。
      - name: 安装 Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: 环境版本
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get --enforce-lockfile

      - name: 检查播放器原生通道（匹配插件 iOS 18 最低目标）
        run: bash tool/check_ios_player_presentation.sh

      - name: 准备并校验片头片尾本地模型
        if: ${{ inputs.typecheck_only != true }}
        run: |
          python3 tool/prepare_intro_models.py

      - name: 准备 Python 运行环境（锁定版本与校验值）
        run: python3 tool/prepare_python_runtime.py

      # 只编译不签名：flutter 会打 xcarchive；签名与导出（exportArchive）由本地重签名流程负责。
      #
      # **每个构建一个可辨认的版本号**（1.0.<run_number>）：设置 →「关于」会显示它。
      # 以前所有包都是 1.0.0(1)，装上旧包从界面上看不出来——真机踩过一次
      # 「代码改了但界面没变」，排查第一步就得能回答「装的是哪一版」。
      - name: 仅检查原生 Swift 类型（不生成安装包）
        if: ${{ inputs.typecheck_only == true }}
        run: |
          set -euo pipefail
          flutter precache --ios
          FLUTTER_ROOT=$(dirname "$(dirname "$(command -v flutter)")")
          FRAMEWORKS="$FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64_x86_64-simulator"
          if [ ! -d "$FRAMEWORKS" ]; then
            FRAMEWORKS=$(find "$FLUTTER_ROOT/bin/cache/artifacts/engine" -type d -path '*/Flutter.xcframework/ios-arm64_x86_64-simulator' | head -1)
          fi
          test -n "$FRAMEWORKS"
          xcrun swiftc -typecheck -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target arm64-apple-ios18.0-simulator -F "$FRAMEWORKS" \
            ios/Runner/SpeechStream.swift ios/Runner/SpeechController.swift \
            ios/Runner/ICloudSyncController.swift ios/Runner/ComicImageToolsController.swift \
            ios/Runner/IntroRecognitionController.swift ios/Runner/LumeGlassBackdrop.swift \
            ios/Runner/LumeSystemTabBar.swift ios/Runner/SourceRepositoryCredentials.swift

      - name: System tab bar simulator check (no IPA)
        if: ${{ inputs.typecheck_only == true }}
        run: bash tool/check_ios_system_tab_bar.sh

      - name: Upload system tab bar simulator preview
        if: ${{ always() && inputs.typecheck_only == true }}
        uses: actions/upload-artifact@v4
        with:
          name: system-tab-bar-preview
          path: out/system-tab-bar/
          if-no-files-found: warn

      - name: Python native bridge and simulator check (no IPA)
        if: ${{ inputs.typecheck_only == true }}
        run: bash tool/check_ios_python.sh

      - name: 编译（--no-codesign，带构建号）
        if: ${{ inputs.typecheck_only != true }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/lumebox-unsigned.xcconfig" <<'EOF'
          CODE_SIGN_ENTITLEMENTS =
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          STRIP_STYLE = non-global
          EOF
          export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/lumebox-unsigned.xcconfig"
          flutter build ipa --no-codesign --verbose \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: 验证离线 MP4 无损合并（实际 FFmpeg 库）
        if: ${{ inputs.typecheck_only != true }}
        run: bash tool/check_offline_remux.sh

      - name: 打包未签名 IPA
        if: ${{ inputs.typecheck_only != true }}
        run: |
          set -euo pipefail
          mkdir -p out
          EXISTING=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n 1 || true)
          if [ -n "${EXISTING}" ]; then
            echo "使用 flutter 直接产出的 IPA：${EXISTING}"
            cp "${EXISTING}" out/LumeBox-unsigned.ipa
          else
            # --no-codesign 只保证产出 .xcarchive：从 archive 里的 Runner.app 现场装成 IPA。
            APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
            if [ ! -d "${APP}" ]; then APP="build/ios/iphoneos/Runner.app"; fi
            if [ ! -d "${APP}" ]; then
              echo "找不到 Runner.app：构建产物缺失"
              echo "--- build/ios 结构（前 50 行）---"
              ls -R build/ios 2>/dev/null | head -50 || true
              exit 1
            fi
            rm -rf out/Payload && mkdir -p out/Payload
            cp -R "${APP}" out/Payload/
            (cd out && zip -qry LumeBox-unsigned.ipa Payload)
          fi
          echo "产物："
          ls -lh out/LumeBox-unsigned.ipa
          unzip -l out/LumeBox-unsigned.ipa > /dev/null && echo "IPA 结构可解压 ✓"

      - name: 上传 Artifact（未签名 IPA）
        if: ${{ inputs.typecheck_only != true }}
        uses: actions/upload-artifact@v4
        with:
          name: LumeBox-unsigned-ipa
          path: |
            out/LumeBox-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
