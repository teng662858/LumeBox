name: Isolated native video simulator check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  playback:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: brew install ffmpeg
      - run: bash tool/check_native_video.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-video-check
          path: out/native-video/
          if-no-files-found: ignore
