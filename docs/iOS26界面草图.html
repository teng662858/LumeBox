<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>映页 · iPhone 界面评审</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e8df;color:#222c28;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}main{max-width:940px;margin:4vh auto;display:grid;grid-template-columns:1fr minmax(320px,405px);gap:8%;align-items:center;padding:24px}aside h1{font:500 clamp(34px,6vw,66px)/1.1 Georgia,serif;letter-spacing:-.055em;margin:18px 0}aside h2{font-size:19px}aside p{max-width:32ch;color:#4d5952}button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}button:focus-visible{outline:3px solid #ca8021;outline-offset:1px}.pages{display:flex;gap:6px;flex-wrap:wrap}.pages button{border:1px solid #868e83;border-radius:99px;padding:7px 14px}.pages button[aria-pressed=true]{background:#24372c;color:white}.phone{position:relative;background:#f8f8f3;color:#202921;border:1px solid #969d91;border-radius:33px;overflow:hidden;min-width:0;box-shadow:0 18px 42px #29382724}.screen{height:min(700px,84vh);min-height:480px;overflow:auto;padding:22px 18px 94px}.phone h2{font-size:32px;margin:6px 0 12px;letter-spacing:-1.8px}.phone h3{font-size:18px;margin:22px 0 10px}.row,header{display:flex;align-items:center;justify-content:space-between;gap:8px}.link{color:#35624b;font-size:14px;min-height:44px}.sub{font-size:13px;color:#596257}.hero,.cover{position:relative;isolation:isolate;overflow:hidden;text-align:left;color:white;background:var(--art);border-radius:13px}.hero{width:100%;min-height:178px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;text-shadow:0 2px 8px #17261f}.hero strong{font:600 34px/1.35 Georgia,serif}.blue{--art:radial-gradient(circle at 70% 26%,#ffe8ae 0 7%,transparent 7.5%),linear-gradient(154deg,transparent 52%,#41616c 52% 65%,#234654 65%),linear-gradient(25deg,#7f9ba0,#80aaa9)}.rust{--art:repeating-linear-gradient(80deg,transparent 0 27px,#753d3249 28px 31px),linear-gradient(145deg,#dab178,#bd654d 62%,#573330)}.green{--art:radial-gradient(ellipse at 100% 100%,#214b44 0 37%,transparent 38%),radial-gradient(ellipse at 2% 82%,#4f7564 0 38%,transparent 39%),linear-gradient(#c5c5a4,#8ca28c)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{padding:0;text-align:left;font-size:14px}.cover{display:grid;place-content:center;width:100%;aspect-ratio:2/3;font:600 21px/1.2 Georgia,serif;letter-spacing:.1em}.tile b{display:block;margin-top:5px}.shelf{border-top:1px solid #d5d9cf}.item{display:block;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid #d5d9cf}.pill,.cta{background:#285944;color:white;border-radius:12px;padding:10px 16px;min-height:44px}.cta{margin:15px 0;width:100%}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chips button{padding:5px 10px;background:#e4e8df;border-radius:8px;min-height:38px}.chips button[aria-pressed=true]{background:#345441;color:white}nav{position:absolute;bottom:12px;left:12px;right:12px;background:#fafbf6ee;backdrop-filter:blur(14px);display:flex;padding:4px;border:1px solid #c1c9bb;border-radius:20px}nav button{flex:1;padding:9px 2px;border-radius:16px;font-weight:bold;color:#647062}nav button[aria-current=page]{background:#dfe9dd;color:#235139}.reader{font:20px/1.95 Georgia,"Songti SC",serif}.player{margin:48px -18px 30px;aspect-ratio:16/9;display:grid;place-content:center;background:var(--art);color:white;text-shadow:0 1px 4px #000}.meter{height:5px;background:#bdc9bb;border-radius:3px}.meter i{display:block;height:100%;width:27%;background:#46775a}input{padding:10px;width:100%;font:inherit;border:1px solid #8b998a;border-radius:10px}.quiet{font-size:13px;color:#596257}
@media(max-width:680px){main{margin:0 auto;max-width:460px;display:flex;flex-direction:column-reverse;padding:8px;gap:12px}.phone,aside{width:100%}.phone{border-radius:20px}.screen{height:74dvh;min-height:400px}aside h1{font-size:30px;margin:0}aside{padding:10px}.pages button{min-height:44px}}@media(prefers-reduced-transparency:reduce){nav{background:#fafbf6;backdrop-filter:none}}
</style>
<main><aside><figure style="display:inline-grid;justify-items:center;gap:5px;margin:0;padding:18px 32px;border-radius:16px;background:#546759;color:white"><img src="brand/yingye-icon.png" width="60" height="60" style="border-radius:14px" alt="书页折成的播放键"><figcaption style="font-size:13px">映页</figcaption></figure><h2>原生 iOS 26 界面提案</h2><p>点手机里的封面、分类和底栏体验导航，也可直接跳到要评审的页面。作品与进度均为演示数据。</p><div class="pages" id="pages"></div><h2 id="label"></h2><p id="note"></p></aside><section class="phone" aria-label="手机界面"><div class="screen" id="screen"></div><nav id="nav" aria-label="主导航"></nav></section></main>
<script>
const names=['远山来信','长街夜话','山间小站'], arts=['blue','rust','green'], books=['山居手记','灯下拾光','远山集'];
const guide={video:['视频','回来先续看。源名称固定在顶栏，切源后保留该源的浏览位置。'],read:['阅读','按漫画、图集、小说和有声书筛选。上次读到的位置和书名同屏。'],lib:['资料库','收藏、历史和下载集中在这里。订阅与设置有固定入口。'],detail:['视频详情','主按钮给出集数和续播时间。当前线路与选集相邻。'],play:['播放器','先保证当前集、返回和进度可见。方向和内核属于播放器上下文。'],reader:['阅读内容','看图时让画面占满宽度，正文随字号重排，听书突出时间线。'],sources:['内容源','常用源在前，当前源清晰可辨。'],settings:['设置','按用户要完成的事情组织设置。'],search:['搜索','默认搜当前板块，保留用户的源选择。']};
let page='video',root='video',entry=0,episode=3,kind='小说',collection='历史',source='常用影视',paused=false,trail=[];
const screenEl=document.getElementById('screen'),nav=document.getElementById('nav');
function btn(t,a,c='item'){return '<button class="'+c+'" data-action="'+a+'">'+t+'</button>'}
function chips(xs,val,prefix){return '<div class="chips">'+xs.map(x=>'<button aria-pressed="'+(x===val)+'" data-action="'+prefix+x+'">'+x+'</button>').join('')+'</div>'}
function tiles(t,act){return '<div class="grid">'+t.map((n,i)=>btn('<span class="cover '+arts[i]+'">'+n.slice(0,2)+'</span><b>'+n+'</b>',act+i,'tile')).join('')+'</div>'}
function hero(n,meta,i,act){return btn('<small>'+meta+'</small><strong>'+n+'</strong>',act,'hero '+arts[i])}
function go(p,top=false){if(top){root=p;trail=[]}else if(page!==p)trail.push(page);page=p;draw()}
function draw(){const main=['video','read','lib'].includes(page);let h=main?'':btn('‹ 返回','back','link');let body='';
if(page==='video')body='<header><h2>视频</h2>'+btn(source+' ▾','sources','link')+btn('搜索','search','link')+'</header><h3>继续观看</h3>'+hero(names[0],'第 3 集 · 12:08',0,'resume')+'<h3>最近更新</h3>'+tiles(names,'v');
if(page==='read')body='<header><h2>阅读</h2>'+btn('搜索','search','link')+'</header>'+chips(['漫画','图集','小说','有声书'],kind,'kind:')+'<h3>继续'+(kind==='有声书'?'收听':'阅读')+'</h3>'+hero(books[0],kind+' · 第 2 章',2,'b0')+'<h3>我的书架</h3>'+tiles(books,'b');
if(page==='lib')body='<header><h2>资料库</h2>'+btn('设置','settings','link')+'</header>'+chips(['收藏','历史','下载'],collection,'col:')+(collection==='下载'?'<h3>暂无下载</h3><p class="sub">已下载的剧集和章节会出现在这里。</p>':btn(names[0]+'<div class="sub">视频 · 第 3 集</div>','v0')+btn(books[0]+'<div class="sub">小说 · 第 2 章</div>','libbook'))+'<h3>管理</h3>'+btn('订阅与内容源　›','sources');
if(page==='detail')body=hero(names[entry],'剧集 · '+source,entry,'play')+btn('▶　'+(entry===0&&episode===3?'继续第 3 集 · 12:08':'播放第 '+episode+' 集'),'play','cta')+'<h3>选集</h3>'+chips([1,2,3,4,5,6],episode,'ep:');
if(page==='play')body='<h2>'+names[entry]+'</h2><p>第 '+episode+' 集</p><div class="player '+arts[entry]+'">画面预览</div><div class="meter"><i></i></div><p>12:08 ／ 45:00</p>'+btn(paused?'▶ 播放':'Ⅱ 暂停','pause','pill');
if(page==='reader')body='<p class="sub">'+kind+' · 第 2 章</p><h2>'+books[entry]+'</h2>'+(kind==='小说'?'<div class="reader">雨停的时候，山径上还留着浅浅的水痕。她把书放回窗台，沿着石阶往下走。<p>小站的钟响了两声。远处有人撑起一把伞，又慢慢收拢。</p></div>':kind==='有声书'?'<div class="meter"><i></i></div><p>05:16 ／ 20:00</p>'+btn(paused?'▶ 继续收听':'Ⅱ 暂停','pause','pill'):'<div class="cover green" style="aspect-ratio:4/5">山间小站</div><p>第 6 页</p>');
if(page==='sources')body='<h2>内容源</h2><p class="sub">视频 · 切换当前浏览源</p>'+['常用影视','家庭片库'].map(x=>btn(x+(source===x?'　✓':''),'src:'+x)).join('');
if(page==='settings')body='<h2>设置</h2>'+btn('订阅与内容源　›','sources')+'<h3>阅读与播放</h3><p>字号跟随系统 · 视频原比例</p><h3>数据与隐私</h3><p>备份与恢复 · 无痕模式 · 诊断</p>';
if(page==='search')body='<h2>搜索'+(root==='read'?'书架':'视频')+'</h2><input id="q" aria-label="搜索作品" placeholder="输入作品名"><div id="hits"></div>';
screenEl.innerHTML=h+body;screenEl.scrollTop=0;nav.hidden=false;nav.style.display=['play','reader'].includes(page)?'none':'flex';nav.innerHTML=['video','read','lib'].map(x=>'<button aria-current="'+(root===x?'page':'false')+'" data-action="tab:'+x+'">'+guide[x][0]+'</button>').join('');document.getElementById('label').textContent=guide[page][0];document.getElementById('note').textContent=guide[page][1];document.getElementById('pages').innerHTML=['video','detail','play','read','reader','lib'].map(x=>'<button aria-pressed="'+(page===x)+'" data-action="jump:'+x+'">'+guide[x][0]+'</button>').join('');
if(page==='search'){const q=document.getElementById('q'),list=root==='read'?books:names;function filter(){document.getElementById('hits').innerHTML=list.map((n,i)=>n.includes(q.value)?btn(n,(root==='read'?'b':'v')+i):'').join('')||'<p>没有匹配的作品</p>'}q.oninput=filter;filter()}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;if(a.startsWith('tab:'))go(a.slice(4),true);else if(a.startsWith('jump:')){const p=a.slice(5);go(['read','reader'].includes(p)?'read':p==='lib'?'lib':'video',true);go(p)}else if(a==='back'){page=trail.pop()||root;draw()}else if(/^[vb]\d$/.test(a)){entry=Number(a[1]);episode=entry===0?3:1;go(a[0]==='v'?'detail':'reader')}else if(a==='resume'){entry=0;episode=3;go('play')}else if(a==='libbook'){kind='小说';entry=0;go('reader')}else if(a==='pause'){paused=!paused;draw()}else if(a.startsWith('kind:')){kind=a.slice(5);draw()}else if(a.startsWith('col:')){collection=a.slice(4);draw()}else if(a.startsWith('ep:')){episode=Number(a.slice(3));draw()}else if(a.startsWith('src:')){source=a.slice(4);go('video',true)}else if(guide[a])go(a)});draw();
</script></html>
